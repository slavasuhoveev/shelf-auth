version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: shelf-auth-postgres
    environment:
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: shelf
      POSTGRES_DB: shelf_auth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf -d shelf_auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:4
    container_name: shelf-auth-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    # Use DATABASE_URL from your environment (export in shell or .env)
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'test -n "$$DATABASE_URL" ||
       (echo "DATABASE_URL env var is required" && exit 1);
       migrate -path=/migrations -database "$$DATABASE_URL" up'
    environment:
      # Example: postgres://shelf:shelf@postgres:5432/shelf_auth?sslmode=disable
      DATABASE_URL: ${DATABASE_URL:-}

  auth:
    build: .
    container_name: shelf-auth
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: dev
      HTTP_ADDR: ":8080"
      LOG_LEVEL: "debug"
      JWT_ALG: "RS256"
      JWT_ISS: "shelf-auth"
      JWT_AUD: "shelf-api"
      ACCESS_TTL: "15m"
      JWKS_MAX_AGE: "300s"
      KEYS_DIR: "/run/secrets/keys"
      SIGNING_KEY_KID: "k1-2025-08-30"
      # IMPORTANT: point to the docker network hostname "postgres"
      DATABASE_URL: "postgres://shelf:shelf@postgres:5432/shelf_auth?sslmode=disable"
    ports:
      - "8081:8080"
    volumes:
      - ./devkeys:/run/secrets/keys:ro

volumes:
  pgdata:
