version: "3.9"

# Reusable environment block (DRY)
x-env-base: &env_base
  ENV: ${ENV:-dev}
  HTTP_ADDR: ${HTTP_ADDR}
  LOG_LEVEL: ${LOG_LEVEL}
  JWT_ALG: ${JWT_ALG}
  JWT_ISS: ${JWT_ISS}
  JWT_AUD: ${JWT_AUD}
  ACCESS_TTL: ${ACCESS_TTL}
  JWKS_MAX_AGE: ${JWKS_MAX_AGE}
  KEYS_DIR: /run/secrets/keys
  SIGNING_KEY_KID: ${SIGNING_KEY_KID}
  DATABASE_URL: ${DATABASE_URL}
  CORS_ORIGINS: ${CORS_ORIGINS}
  COOKIE_SECURE: ${COOKIE_SECURE}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN}

services:
  postgres:
    image: postgres:16-alpine
    container_name: shelf-auth-postgres
    environment:
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: shelf
      POSTGRES_DB: shelf_auth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf -d shelf_auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:4
    container_name: shelf-auth-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    environment:
      <<: *env_base

  auth:
    image: "${IMAGE}"
    container_name: "${PROJECT_NAME}"
    build:
      context: .
      target: production
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *env_base
    ports:
      - "8081:8080"
    volumes:
      # mount dev keys into container path from KEYS_DIR
      - ./devkeys:/run/secrets/keys:ro

  test:
    build:
      context: .
      target: test
    working_dir: /app
    volumes:
      - .:/app

volumes:
  pgdata:
