name: Infrastructure
description: DevOps, CI/CD, Docker, deployment, or environment configuration task
title: "[Infra]: "
labels: ["type:infra"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Infrastructure Task

        Task related to deployment, CI/CD, environment setup,
        containerization, or platform configuration.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What infrastructure improvement is required?
      placeholder: |
        - Add CI pipeline
        - Improve Docker build
        - Configure Kubernetes
        - Add monitoring
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which services/environments are affected?
      placeholder: |
        - shelf-auth
        - shelf-api
        - shelf-frontend
        - production
        - staging
    validations:
      required: true

  - type: textarea
    id: technical_details
    attributes:
      label: Technical Details
      description: Implementation approach or requirements
      placeholder: |
        - Tools involved:
        - Configuration changes:
        - Dependencies:
    validations:
      required: false

  - type: checkboxes
    id: verification
    attributes:
      label: Verification Checklist
      options:
        - label: Local environment tested
        - label: Build succeeds
        - label: Deployment tested (if applicable)
        - label: No service downtime introduced
