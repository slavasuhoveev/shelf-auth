name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  check:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run quality checks
        run: make check


  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: make test-unit-v

      - name: Run integration tests
        run: make test-int-v

      - name: Cleanup test environment
        if: always()
        run: make down


  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    needs:
      - check
      - test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
          | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Build image
        run: make build TAG=${{ github.sha }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: make push TAG=${{ github.sha }}

      - name: Cleanup docker artifacts
        if: always()
        run: docker image prune -af
